          /**
           * MJ Floating Orb + Rainbow Edge Lighting (system-wide overlay).
           *
           * - Particle orb (mirrors the in-app Jarvis orb): orbiting particle
           *   ring + glowing core, rainbow hue auto-cycles, pulses in sync with
           *   the voice session state. Draggable with edge magnetism; tap opens MJ.
           * - Edge lighting: frosted rainbow glow around the screen edges —
           *   ONLY while the MJ app is minimized; hidden while the app is on top.
