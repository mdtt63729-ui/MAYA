name: Build MJ Assistant Android Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Unsigned Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Setup Android Project & Sync Capacitor
        run: |
          npx cap add android || true

          # ---------------------------------------------------------------
          # NATIVE LAYER: Capacitor plugin (app scanning, launching, URLs,
          # background voice service) + manifest permissions.
          # ---------------------------------------------------------------
          JAVA_DIR="android/app/src/main/java/com/mj/assistant"
          mkdir -p "$JAVA_DIR"

          cat > "$JAVA_DIR/MJNativePlugin.java" << 'JAVAEOF'
          package com.mj.assistant;

          import android.accessibilityservice.AccessibilityService;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.drawable.Drawable;
          import android.hardware.camera2.CameraCharacteristics;
          import android.hardware.camera2.CameraManager;
          import android.media.AudioManager;
          import android.net.Uri;
          import android.os.BatteryManager;
          import android.os.Build;
          import android.provider.AlarmClock;
          import android.provider.Settings;
          import android.util.Base64;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.ByteArrayOutputStream;
          import java.util.List;

          @CapacitorPlugin(name = "MJNative")
          public class MJNativePlugin extends Plugin {

              @PluginMethod
              public void getInstalledApps(PluginCall call) {
                  // Rasterizing hundreds of app icons on the UI thread causes ANRs
                  // on low-end phones (the "apps never scanned" bug) — so the
                  // whole scan runs on a background worker and resolves from there.
                  Thread worker = new Thread(new Runnable() {
                      @Override
                      public void run() {
                          JSArray apps = new JSArray();
                          try {
                              PackageManager pm = getContext().getPackageManager();
                              Intent mainIntent = new Intent(Intent.ACTION_MAIN, null);
                              mainIntent.addCategory(Intent.CATEGORY_LAUNCHER);
                              List<ResolveInfo> activities = pm.queryIntentActivities(mainIntent, 0);
                              for (ResolveInfo ri : activities) {
                                  try {
                                      JSObject app = new JSObject();
                                      app.put("id", ri.activityInfo.packageName);
                                      app.put("name", ri.loadLabel(pm).toString());
                                      app.put("packageName", ri.activityInfo.packageName);
                                      Drawable icon = ri.activityInfo.loadIcon(pm);
                                      if (icon != null) {
                                          int size = 48;
                                          Bitmap bmp = Bitmap.createBitmap(size, size, Bitmap.Config.ARGB_8888);
                                          Canvas canvas = new Canvas(bmp);
                                          icon.setBounds(0, 0, size, size);
                                          icon.draw(canvas);
                                          ByteArrayOutputStream out = new ByteArrayOutputStream();
                                          bmp.compress(Bitmap.CompressFormat.PNG, 70, out);
                                          app.put("icon", "data:image/png;base64," + Base64.encodeToString(out.toByteArray(), Base64.NO_WRAP));
                                      }
                                      apps.put(app);
                                  } catch (Exception ignored) {
                                  }
                              }
                          } catch (Exception e) {
                              try { call.reject("Failed to scan apps: " + e.getMessage()); } catch (Exception ignored) {}
                              return;
                          }
                          JSObject ret = new JSObject();
                          ret.put("apps", apps);
                          call.resolve(ret);
                      }
                  });
                  worker.setName("mj-app-scan");
                  worker.setPriority(Thread.NORM_PRIORITY - 1);
                  worker.start();
              }

              // ---------------- PERMISSION CENTER (onboarding) ----------------

              /** Triggers the real Android runtime permission popups (mic + notifications). */
              @PluginMethod
              public void requestRuntimePermissions(PluginCall call) {
                  try {
                      android.app.Activity activity = getActivity();
                      if (activity != null && Build.VERSION.SDK_INT >= 23) {
                          java.util.List<String> wanted = new java.util.ArrayList<String>();
                          if (getContext().checkSelfPermission(android.Manifest.permission.RECORD_AUDIO)
                                  != PackageManager.PERMISSION_GRANTED) {
                              wanted.add(android.Manifest.permission.RECORD_AUDIO);
                          }
                          if (Build.VERSION.SDK_INT >= 33
                                  && getContext().checkSelfPermission("android.permission.POST_NOTIFICATIONS")
                                  != PackageManager.PERMISSION_GRANTED) {
                              wanted.add("android.permission.POST_NOTIFICATIONS");
                          }
                          if (!wanted.isEmpty()) {
                              activity.requestPermissions(wanted.toArray(new String[0]), 4711);
                          }
                      }
                      call.resolve();
                  } catch (Exception e) {
                      call.reject(e.getMessage());
                  }
              }

              /** Live status of every permission the onboarding Permission Center shows. */
              @PluginMethod
              public void getPermissionStatus(PluginCall call) {
                  JSObject ret = new JSObject();
                  try {
                      ret.put("mic", getContext().checkSelfPermission(android.Manifest.permission.RECORD_AUDIO)
                              == PackageManager.PERMISSION_GRANTED);
                      boolean notif = true;
                      if (Build.VERSION.SDK_INT >= 33) {
                          notif = getContext().checkSelfPermission("android.permission.POST_NOTIFICATIONS")
                                  == PackageManager.PERMISSION_GRANTED;
                      }
                      ret.put("notifications", notif);
                      ret.put("overlay", Settings.canDrawOverlays(getContext()));
                      ret.put("accessibility", MJAccessibilityService.isServiceEnabled(getContext()));
                  } catch (Exception e) {
                      ret.put("mic", false);
                      ret.put("notifications", false);
                      ret.put("overlay", false);
                      ret.put("accessibility", false);
                  }
                  call.resolve(ret);
              }

              @PluginMethod
              public void launchApp(PluginCall call) {
                  String pkg = call.getString("packageName");
                  if (pkg == null || pkg.isEmpty()) {
                      call.reject("packageName required");
                      return;
                  }
                  try {
                      Intent intent = getContext().getPackageManager().getLaunchIntentForPackage(pkg);
                      if (intent == null) {
                          call.reject("App not found: " + pkg);
                          return;
                      }
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(intent);
                      call.resolve();
                  } catch (Exception e) {
                      call.reject(e.getMessage());
                  }
              }

              @PluginMethod
              public void openUrl(PluginCall call) {
                  String url = call.getString("url");
                  if (url == null || url.isEmpty()) {
                      call.reject("url required");
                      return;
                  }
                  try {
                      Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(intent);
                      call.resolve();
                  } catch (Exception e) {
                      call.reject(e.getMessage());
                  }
              }

              @PluginMethod
              public void startVoiceService(PluginCall call) {
                  try {
                      Intent intent = new Intent(getContext(), MJVoiceService.class);
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          getContext().startForegroundService(intent);
                      } else {
                          getContext().startService(intent);
                      }
                      call.resolve();
                  } catch (Exception e) {
                      call.reject(e.getMessage());
                  }
              }

              @PluginMethod
              public void stopVoiceService(PluginCall call) {
                  try {
                      getContext().stopService(new Intent(getContext(), MJVoiceService.class));
                      call.resolve();
                  } catch (Exception e) {
                      call.reject(e.getMessage());
                  }
              }

              // ---------------- FAST LOCAL PATH (Ultra-Fast Response PRD) ----------------
              // Real device controls executed locally with zero cloud round-trip.

              @PluginMethod
              public void setTorch(PluginCall call) {
                  Boolean on = call.getBoolean("on");
                  if (on == null) { call.reject("on required"); return; }
                  try {
                      CameraManager cm = (CameraManager) getContext().getSystemService(Context.CAMERA_SERVICE);
                      String torchCamera = null;
                      for (String id : cm.getCameraIdList()) {
                          Boolean hasFlash = cm.getCameraCharacteristics(id).get(CameraCharacteristics.FLASH_INFO_AVAILABLE);
                          if (Boolean.TRUE.equals(hasFlash)) { torchCamera = id; break; }
                      }
                      if (torchCamera == null) { call.reject("No flash unit available on this device"); return; }
                      cm.setTorchMode(torchCamera, on);
                      JSObject ret = new JSObject();
                      ret.put("on", on);
                      call.resolve(ret);
                  } catch (Exception e) {
                      call.reject(e.getMessage());
                  }
              }

              @PluginMethod
              public void adjustVolume(PluginCall call) {
                  String direction = call.getString("direction");
                  if (direction == null) { call.reject("direction required"); return; }
                  try {
                      AudioManager am = (AudioManager) getContext().getSystemService(Context.AUDIO_SERVICE);
                      if ("up".equals(direction)) {
                          am.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_RAISE, AudioManager.FLAG_SHOW_UI);
                      } else if ("down".equals(direction)) {
                          am.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_LOWER, AudioManager.FLAG_SHOW_UI);
                      } else if ("mute".equals(direction)) {
                          am.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_MUTE, AudioManager.FLAG_SHOW_UI);
                      } else if ("unmute".equals(direction)) {
                          am.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_UNMUTE, AudioManager.FLAG_SHOW_UI);
                      } else {
                          call.reject("direction must be up|down|mute|unmute");
                          return;
                      }
                      call.resolve();
                  } catch (Exception e) {
                      call.reject(e.getMessage());
                  }
              }

              @PluginMethod
              public void openSystemSetting(PluginCall call) {
                  String key = call.getString("setting");
                  Intent intent;
                  if ("wifi".equals(key)) intent = new Intent(Settings.ACTION_WIFI_SETTINGS);
                  else if ("bluetooth".equals(key)) intent = new Intent(Settings.ACTION_BLUETOOTH_SETTINGS);
                  else if ("airplane".equals(key)) intent = new Intent(Settings.ACTION_AIRPLANE_MODE_SETTINGS);
                  else if ("display".equals(key)) intent = new Intent(Settings.ACTION_DISPLAY_SETTINGS);
                  else if ("sound".equals(key)) intent = new Intent(Settings.ACTION_SOUND_SETTINGS);
                  else if ("location".equals(key)) intent = new Intent(Settings.ACTION_LOCATION_SOURCE_SETTINGS);
                  else if ("appsettings".equals(key)) intent = new Intent(Settings.ACTION_APPLICATION_SETTINGS);
                  else intent = new Intent(Settings.ACTION_SETTINGS);
                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  try {
                      getContext().startActivity(intent);
                      call.resolve();
                  } catch (Exception e) {
                      call.reject(e.getMessage());
                  }
              }

              @PluginMethod
              public void startTimer(PluginCall call) {
                  Integer seconds = call.getInt("seconds");
                  String label = call.getString("label");
                  if (seconds == null || seconds <= 0) { call.reject("seconds required"); return; }
                  try {
                      Intent i = new Intent(AlarmClock.ACTION_SET_TIMER)
                              .putExtra(AlarmClock.EXTRA_LENGTH, seconds)
                              .putExtra(AlarmClock.EXTRA_MESSAGE, label != null ? label : "MJ Timer")
                              .putExtra(AlarmClock.EXTRA_SKIP_UI, true)
                              .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(i);
                      call.resolve();
                  } catch (Exception e) {
                      call.reject(e.getMessage());
                  }
              }

              @PluginMethod
              public void globalAction(PluginCall call) {
                  String action = call.getString("action");
                  if (action == null) { call.reject("action required (back|home|recents|notifications)"); return; }
                  boolean ok = MJAccessibilityService.performAction(action);
                  if (ok) {
                      call.resolve();
                  } else {
                      call.reject("Accessibility service is not enabled. Enable it in Android Settings.");
                  }
              }

              @PluginMethod
              public void isAccessibilityEnabled(PluginCall call) {
                  JSObject ret = new JSObject();
                  ret.put("enabled", MJAccessibilityService.isServiceEnabled(getContext()));
                  call.resolve(ret);
              }

              @PluginMethod
              public void openAccessibilitySettings(PluginCall call) {
                  try {
                      MJAccessibilityService.openSettings(getContext());
                      call.resolve();
                  } catch (Exception e) {
                      call.reject(e.getMessage());
                  }
              }

              @PluginMethod
              public void getDeviceStatus(PluginCall call) {
                  JSObject ret = new JSObject();
                  try {
                      BatteryManager bm = (BatteryManager) getContext().getSystemService(Context.BATTERY_SERVICE);
                      int level = bm.getIntProperty(BatteryManager.BATTERY_PROPERTY_CAPACITY);
                      boolean charging = bm.isCharging();
                      ret.put("batteryLevel", level);
                      ret.put("charging", charging);
                  } catch (Exception e) {
                      ret.put("batteryLevel", -1);
                      ret.put("charging", false);
                  }
                  call.resolve(ret);
              }

              @PluginMethod
              public void getForegroundApp(PluginCall call) {
                  JSObject ret = new JSObject();
                  ret.put("packageName", MJAccessibilityService.getForegroundPackage());
                  ret.put("accessibilityEnabled", MJAccessibilityService.isServiceEnabled(getContext()));
                  call.resolve(ret);
              }

              // ---------------- ANDROID AGENT (Accessibility screen control) ----------------

              /**
               * Unified screen-automation endpoint.
               * action: find | click | type | scroll | read
               *   find   — matchText/matchDesc/editable/clickable/excludeEditable, waits up to timeoutMs
               *   click  — finds then clicks (ancestor walk + gesture fallback)
               *   type   — finds an editable node and sets its text (read-back in "text")
               *   scroll — value "down"/"up"
               *   read   — returns visible texts
               */
              @PluginMethod
              public void screenAction(PluginCall call) {
                  if (!MJAccessibilityService.isServiceEnabled(getContext())) {
                      call.reject("Accessibility service is not enabled. Enable it in Android Settings.");
                      return;
                  }
                  final String action = call.getString("action", "find");
                  final String matchText = call.getString("matchText");
                  final String matchDesc = call.getString("matchDesc");
                  final String value = call.getString("value");
                  final boolean editable = Boolean.TRUE.equals(call.getBoolean("editable", false));
                  final boolean clickable = Boolean.TRUE.equals(call.getBoolean("clickable", false));
                  final boolean excludeEditable = Boolean.TRUE.equals(call.getBoolean("excludeEditable", false));
                  Integer timeoutBoxed = call.getInt("timeoutMs", 6000);
                  final int timeoutMs = timeoutBoxed == null ? 6000 : timeoutBoxed;
                  final long deadline = System.currentTimeMillis() + timeoutMs;

                  Thread worker = new Thread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              if ("read".equals(action)) {
                                  java.util.List<String> texts = MJAccessibilityService.collectVisibleTexts();
                                  JSArray arr = new JSArray();
                                  for (String t : texts) arr.put(t);
                                  JSObject ret = new JSObject();
                                  ret.put("texts", arr);
                                  call.resolve(ret);
                                  return;
                              }
                              if ("scroll".equals(action)) {
                                  boolean down = "down".equals(value);
                                  boolean ok = MJAccessibilityService.scrollScreen(down);
                                  JSObject ret = new JSObject();
                                  ret.put("found", ok);
                                  ret.put("success", ok);
                                  call.resolve(ret);
                                  return;
                              }
                              android.view.accessibility.AccessibilityNodeInfo node = null;
                              while (System.currentTimeMillis() < deadline) {
                                  node = MJAccessibilityService.findNodeByQuery(matchText, matchDesc, editable, clickable, excludeEditable);
                                  if (node != null) break;
                                  try { Thread.sleep(300); } catch (InterruptedException ie) { break; }
                              }
                              JSObject ret = new JSObject();
                              if (node == null) {
                                  ret.put("found", false);
                                  ret.put("success", false);
                                  call.resolve(ret);
                                  return;
                              }
                              if ("find".equals(action)) {
                                  ret.put("found", true);
                                  ret.put("success", true);
                                  ret.put("text", node.getText() == null ? "" : node.getText().toString());
                                  call.resolve(ret);
                              } else if ("click".equals(action)) {
                                  boolean ok = MJAccessibilityService.clickNode(node);
                                  ret.put("found", true);
                                  ret.put("success", ok);
                                  call.resolve(ret);
                              } else if ("type".equals(action)) {
                                  String v = value == null ? "" : value;
                                  boolean ok = MJAccessibilityService.setNodeText(node, v);
                                  ret.put("found", true);
                                  ret.put("success", ok);
                                  ret.put("text", v);
                                  call.resolve(ret);
                              } else {
                                  call.reject("Unknown action");
                              }
                          } catch (Exception e) {
                              try { call.reject(e.getMessage()); } catch (Exception ignored) {}
                          }
                      }
                  });
                  worker.setName("mj-screen-action");
                  worker.start();
              }

              // ---------------- FLOATING ORB OVERLAY ----------------

              @PluginMethod
              public void isOverlayEnabled(PluginCall call) {
                  JSObject ret = new JSObject();
                  try {
                      ret.put("granted", Settings.canDrawOverlays(getContext()));
                  } catch (Exception e) {
                      ret.put("granted", false);
                  }
                  call.resolve(ret);
              }

              @PluginMethod
              public void openOverlaySettings(PluginCall call) {
                  try {
                      Intent i = new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              android.net.Uri.parse("package:" + getContext().getPackageName()));
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(i);
                      call.resolve();
                  } catch (Exception e) {
                      call.reject(e.getMessage());
                  }
              }

              @PluginMethod
              public void startOverlay(PluginCall call) {
                  if (!Settings.canDrawOverlays(getContext())) {
                      call.reject("Overlay permission not granted");
                      return;
                  }
                  try {
                      getContext().startService(new Intent(getContext(), MJOverlayService.class));
                      call.resolve();
                  } catch (Exception e) {
                      call.reject(e.getMessage());
                  }
              }

              @PluginMethod
              public void stopOverlay(PluginCall call) {
                  try {
                      getContext().stopService(new Intent(getContext(), MJOverlayService.class));
                      call.resolve();
                  } catch (Exception e) {
                      call.reject(e.getMessage());
                  }
              }

              @PluginMethod
              public void setOverlayState(PluginCall call) {
                  String s = call.getString("state");
                  MJOverlayService.setAgentState(s);
                  call.resolve();
              }

              // ---------------- OFFLINE MODE (on-device STT + TTS) ----------------

              private android.speech.SpeechRecognizer offlineRecognizer;
              private volatile boolean offlineListeningActive = false;
              private android.speech.tts.TextToSpeech offlineTts;
              private volatile boolean ttsReady = false;

              private android.content.Intent buildOfflineIntent(String language) {
                  android.content.Intent intent = new android.content.Intent(
                          android.speech.RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                  intent.putExtra(android.speech.RecognizerIntent.EXTRA_LANGUAGE_MODEL,
                          android.speech.RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                  intent.putExtra(android.speech.RecognizerIntent.EXTRA_LANGUAGE, language);
                  intent.putExtra(android.speech.RecognizerIntent.EXTRA_PARTIAL_RESULTS, true);
                  if (Build.VERSION.SDK_INT >= 23) {
                      intent.putExtra(android.speech.RecognizerIntent.EXTRA_PREFER_OFFLINE, true);
                  }
                  return intent;
              }

              private void restartOffline(final String language) {
                  if (!offlineListeningActive) return;
                  final android.speech.SpeechRecognizer r = offlineRecognizer;
                  new android.os.Handler(android.os.Looper.getMainLooper()).postDelayed(new Runnable() {
                      @Override
                      public void run() {
                          if (!offlineListeningActive || offlineRecognizer == null || offlineRecognizer != r) return;
                          try {
                              offlineRecognizer.startListening(buildOfflineIntent(language));
                          } catch (Exception ignored) {
                          }
                      }
                  }, 300);
              }

              private String mapSttError(int error) {
                  switch (error) {
                      case android.speech.SpeechRecognizer.ERROR_NO_MATCH: return "no_match";
                      case android.speech.SpeechRecognizer.ERROR_SPEECH_TIMEOUT: return "timeout";
                      case android.speech.SpeechRecognizer.ERROR_NETWORK:
                      case android.speech.SpeechRecognizer.ERROR_NETWORK_TIMEOUT: return "network";
                      case android.speech.SpeechRecognizer.ERROR_INSUFFICIENT_PERMISSIONS: return "permission";
                      default: return "error_" + error;
                  }
              }

              /**
               * Continuous ON-DEVICE speech recognition (works with no network
               * when the language pack is installed). Fires the plugin events:
               *   offlineTranscript { text, isFinal }
               *   offlineError { message }
               */
              @PluginMethod
              public void startOfflineListening(PluginCall call) {
                  final String language = call.getString("language", "en-IN");
                  final android.app.Activity activity = getActivity();
                  if (activity == null) {
                      call.reject("No activity");
                      return;
                  }
                  if (!android.speech.SpeechRecognizer.isRecognitionAvailable(getContext())) {
                      call.reject("Speech recognition is not available on this device");
                      return;
                  }
                  activity.runOnUiThread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              if (offlineRecognizer != null) {
                                  try { offlineRecognizer.destroy(); } catch (Exception ignored) { }
                                  offlineRecognizer = null;
                              }
                              offlineListeningActive = true;
                              offlineRecognizer = android.speech.SpeechRecognizer.createSpeechRecognizer(getContext());
                              offlineRecognizer.setRecognitionListener(new android.speech.RecognitionListener() {
                                  @Override public void onReadyForSpeech(android.os.Bundle params) { }
                                  @Override public void onBeginningOfSpeech() { }
                                  @Override public void onRmsChanged(float rmsdB) { }
                                  @Override public void onBufferReceived(byte[] buffer) { }
                                  @Override public void onEndOfSpeech() { }
                                  @Override
                                  public void onError(int error) {
                                      String msg = mapSttError(error);
                                      if (!"no_match".equals(msg) && !"timeout".equals(msg)) {
                                          JSObject d = new JSObject();
                                          d.put("message", msg);
                                          notifyListeners("offlineError", d);
                                      }
                                      restartOffline(language);
                                  }
                                  @Override
                                  public void onResults(android.os.Bundle results) {
                                      java.util.ArrayList<String> list = results.getStringArrayList(
                                              android.speech.SpeechRecognizer.RESULTS_RECOGNITION);
                                      if (list != null && !list.isEmpty() && list.get(0) != null && list.get(0).length() > 0) {
                                          JSObject d = new JSObject();
                                          d.put("text", list.get(0));
                                          d.put("isFinal", true);
                                          notifyListeners("offlineTranscript", d);
                                      }
                                      restartOffline(language);
                                  }
                                  @Override
                                  public void onPartialResults(android.os.Bundle partialResults) {
                                      java.util.ArrayList<String> list = partialResults.getStringArrayList(
                                              android.speech.SpeechRecognizer.RESULTS_RECOGNITION);
                                      if (list != null && !list.isEmpty() && list.get(0) != null && list.get(0).length() > 0) {
                                          JSObject d = new JSObject();
                                          d.put("text", list.get(0));
                                          d.put("isFinal", false);
                                          notifyListeners("offlineTranscript", d);
                                      }
                                  }
                                  @Override public void onEvent(int eventType, android.os.Bundle params) { }
                              });
                              offlineRecognizer.startListening(buildOfflineIntent(language));
                              call.resolve();
                          } catch (Exception e) {
                              call.reject(e.getMessage());
                          }
                      }
                  });
              }

              @PluginMethod
              public void stopOfflineListening(PluginCall call) {
                  offlineListeningActive = false;
                  final android.speech.SpeechRecognizer r = offlineRecognizer;
                  offlineRecognizer = null;
                  if (r != null) {
                  	try {
                  		getActivity().runOnUiThread(new Runnable() {
                  			@Override
                  			public void run() {
                  				try {
                  					r.stopListening();
                  					r.destroy();
                  				} catch (Exception ignored) {
                  				}
                  			}
                  		});
                  	} catch (Exception ignored) {
                  	}
                  }
                  call.resolve();
              }

              /** Local TTS voice acknowledgement (Bengali when the engine supports it). */
              @PluginMethod
              public void speakOffline(PluginCall call) {
                  String text = call.getString("text", "");
                  if (text == null || text.length() == 0) {
                      call.resolve();
                      return;
                  }
                  try {
                      if (offlineTts == null) {
                          offlineTts = new android.speech.tts.TextToSpeech(getContext(),
                                  new android.speech.tts.TextToSpeech.OnInitListener() {
                                      @Override
                                      public void onInit(int status) {
                                          if (status == android.speech.tts.TextToSpeech.SUCCESS) {
                                              ttsReady = true;
                                              try {
                                                  int r = offlineTts.setLanguage(new java.util.Locale("bn", "IN"));
