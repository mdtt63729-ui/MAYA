          package com.mj.assistant;

          import android.accessibilityservice.AccessibilityService;
          import android.content.Context;
          import android.content.Intent;
          import android.provider.Settings;
          import android.view.accessibility.AccessibilityEvent;
          import android.view.accessibility.AccessibilityNodeInfo;

          /**
           * MJ Accessibility Service — foundation of the Android Agent.
           * Provides system navigation (Back/Home/Recents) and foreground-app
           * tracking (launch verification). MUST be enabled by the user from
           * Android Settings; MJ never enables or bypasses it silently.
           */
          public class MJAccessibilityService extends AccessibilityService {
              private static volatile MJAccessibilityService instance;
              private static volatile String foregroundPackage = "";

              @Override
              protected void onServiceConnected() {
                  super.onServiceConnected();
                  instance = this;
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
                  if (event.getEventType() == AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) {
                      CharSequence pkg = event.getPackageName();
                      if (pkg != null) {
                          foregroundPackage = pkg.toString();
                      }
                  }
              }

              @Override
              public void onInterrupt() {
                  // No-op
              }

              @Override
              public void onDestroy() {
                  instance = null;
                  super.onDestroy();
              }

              /** Returns true if the requested global action was performed. */
              public static boolean performAction(String action) {
                  MJAccessibilityService svc = instance;
                  if (svc == null) return false;
                  int id;
                  if ("home".equals(action)) {
                      id = GLOBAL_ACTION_HOME;
                  } else if ("recents".equals(action)) {
                      id = GLOBAL_ACTION_RECENTS;
                  } else if ("notifications".equals(action)) {
                      id = GLOBAL_ACTION_NOTIFICATIONS;
                  } else {
                      id = GLOBAL_ACTION_BACK;
                  }
                  return svc.performGlobalAction(id);
              }

              /** Currently focused app package ("" when the service is off). */
              public static String getForegroundPackage() {
                  return foregroundPackage == null ? "" : foregroundPackage;
              }

              /** Whether the user has enabled this service in Android Settings. */
              public static boolean isServiceEnabled(Context ctx) {
                  try {
                      String setting = Settings.Secure.getString(
                              ctx.getContentResolver(), Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES);
                      return setting != null && setting.contains(ctx.getPackageName() + "/.MJAccessibilityService");
                  } catch (Exception e) {
                      return false;
                  }
              }

              /** Opens the Android Accessibility settings screen. */
              public static void openSettings(Context ctx) {
                  Intent intent = new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS);
                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  ctx.startActivity(intent);
              }

              // ---------------- ANDROID AGENT: node tree inspection & interaction ----------------

              /**
               * Finds a node by contained text or contentDescription.
               * requireEditable / requireClickable constrain the match;
               * excludeEditable skips text fields (used for picking suggestions).
               */
              public static AccessibilityNodeInfo findNodeByQuery(
                      String matchText, String matchDesc,
                      boolean requireEditable, boolean requireClickable, boolean excludeEditable) {
                  MJAccessibilityService svc = instance;
                  if (svc == null) return null;
                  AccessibilityNodeInfo root = svc.getRootInActiveWindow();
                  if (root == null) return null;
                  return findInTree(root, matchText, matchDesc, requireEditable, requireClickable, excludeEditable);
              }

              private static boolean nodeMatches(
                      AccessibilityNodeInfo n, String matchText, String matchDesc,
                      boolean requireEditable, boolean requireClickable, boolean excludeEditable) {
                  if (requireEditable && !n.isEditable()) return false;
                  if (requireClickable && !n.isClickable()) return false;
                  if (excludeEditable && n.isEditable()) return false;
                  String ts = n.getText() == null ? "" : n.getText().toString().toLowerCase().trim();
                  String ds = n.getContentDescription() == null ? "" : n.getContentDescription().toString().toLowerCase().trim();
                  if (matchDesc != null && matchDesc.length() > 0) return ds.contains(matchDesc.toLowerCase());
                  if (matchText != null && matchText.length() > 0) {
                      return ts.contains(matchText.toLowerCase()) || ds.contains(matchText.toLowerCase());
                  }
                  return ts.length() > 0 || ds.length() > 0;
              }

              private static AccessibilityNodeInfo findInTree(
                      AccessibilityNodeInfo node, String matchText, String matchDesc,
                      boolean requireEditable, boolean requireClickable, boolean excludeEditable) {
                  if (nodeMatches(node, matchText, matchDesc, requireEditable, requireClickable, excludeEditable)) return node;
                  for (int i = 0; i < node.getChildCount(); i++) {
                      AccessibilityNodeInfo child = node.getChild(i);
                      if (child == null) continue;
                      AccessibilityNodeInfo found = findInTree(child, matchText, matchDesc, requireEditable, requireClickable, excludeEditable);
                      if (found != null) return found;
                  }
                  return null;
              }

              /** Click via ACTION_CLICK, walking up to clickable ancestors; gesture-tap fallback. */
              public static boolean clickNode(AccessibilityNodeInfo node) {
                  AccessibilityNodeInfo current = node;
                  for (int depth = 0; depth < 6 && current != null; depth++) {
                      if (current.isClickable() && current.performAction(AccessibilityNodeInfo.ACTION_CLICK)) return true;
                      current = current.getParent();
                  }
                  return gestureTapAtNode(node);
              }

              /** Sets text via ACTION_SET_TEXT (replaces existing content). */
              public static boolean setNodeText(AccessibilityNodeInfo node, String value) {
                  android.os.Bundle args = new android.os.Bundle();
                  args.putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, value);
                  return node.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, args);
              }

              /** Scrolls the first scrollable node forward/backward; gesture-swipe fallback. */
              public static boolean scrollScreen(boolean forward) {
                  MJAccessibilityService svc = instance;
                  if (svc == null) return false;
                  AccessibilityNodeInfo root = svc.getRootInActiveWindow();
                  if (root == null) return false;
                  AccessibilityNodeInfo scrollable = findScrollable(root);
                  if (scrollable != null) {
                      if (scrollable.performAction(forward
                              ? AccessibilityNodeInfo.ACTION_SCROLL_FORWARD
                              : AccessibilityNodeInfo.ACTION_SCROLL_BACKWARD)) return true;
                  }
                  return gestureSwipe(forward);
              }

              private static AccessibilityNodeInfo findScrollable(AccessibilityNodeInfo node) {
                  if (node.isScrollable()) return node;
                  for (int i = 0; i < node.getChildCount(); i++) {
                      AccessibilityNodeInfo child = node.getChild(i);
                      if (child == null) continue;
                      AccessibilityNodeInfo found = findScrollable(child);
                      if (found != null) return found;
                  }
                  return null;
              }

              /** Collects visible texts + content descriptions (capped) for screen reading. */
              public static java.util.List<String> collectVisibleTexts() {
                  java.util.List<String> out = new java.util.ArrayList<String>();
                  MJAccessibilityService svc = instance;
                  if (svc == null) return out;
                  AccessibilityNodeInfo root = svc.getRootInActiveWindow();
                  if (root == null) return out;
                  collectTexts(root, out, 0);
                  return out;
              }

              private static void collectTexts(AccessibilityNodeInfo node, java.util.List<String> out, int depth) {
                  if (depth > 25 || out.size() >= 80) return;
                  CharSequence t = node.getText();
                  CharSequence d = node.getContentDescription();
                  if (t != null && t.toString().trim().length() > 0) out.add(t.toString().trim());
                  else if (d != null && d.toString().trim().length() > 0) out.add(d.toString().trim());
                  for (int i = 0; i < node.getChildCount(); i++) {
                      AccessibilityNodeInfo child = node.getChild(i);
                      if (child == null) continue;
                      collectTexts(child, out, depth + 1);
                  }
              }

              private static boolean gestureTapAtNode(AccessibilityNodeInfo node) {
                  android.graphics.Rect r = new android.graphics.Rect();
                  node.getBoundsInScreen(r);
                  return gestureTap(r.centerX(), r.centerY());
              }

              public static boolean gestureTap(int x, int y) {
                  MJAccessibilityService svc = instance;
                  if (svc == null) return false;
                  try {
                      android.graphics.Path p = new android.graphics.Path();
                      p.moveTo(x, y);
                      android.accessibilityservice.GestureDescription.Builder b = new android.accessibilityservice.GestureDescription.Builder();
                      b.addStroke(new android.accessibilityservice.GestureDescription.StrokeDescription(p, 0, 60));
                      return svc.dispatchGesture(b.build(), null, null);
                  } catch (Exception e) {
                      return false;
                  }
              }

              /** Swipes (scroll down = content moves up). */
              public static boolean gestureSwipe(boolean scrollDown) {
                  MJAccessibilityService svc = instance;
                  if (svc == null) return false;
                  try {
                      android.util.DisplayMetrics dm = svc.getResources().getDisplayMetrics();
                      int w = dm.widthPixels, h = dm.heightPixels;
                      android.graphics.Path p = new android.graphics.Path();
                      if (scrollDown) { p.moveTo(w / 2, (int) (h * 0.70f)); p.lineTo(w / 2, (int) (h * 0.35f)); }
                      else { p.moveTo(w / 2, (int) (h * 0.35f)); p.lineTo(w / 2, (int) (h * 0.70f)); }
                      android.accessibilityservice.GestureDescription.Builder b = new android.accessibilityservice.GestureDescription.Builder();
                      b.addStroke(new android.accessibilityservice.GestureDescription.StrokeDescription(p, 0, 300));
                      return svc.dispatchGesture(b.build(), null, null);
                  } catch (Exception e) {
                      return false;
                  }
              }
          }
