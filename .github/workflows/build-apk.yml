name: Build MJ Assistant Android Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Unsigned Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Setup Android Project & Sync Capacitor
        run: |
          npx cap add android || true
          # MIC PERMISSION FIX: the generated Capacitor AndroidManifest.xml does
          # NOT include RECORD_AUDIO by default — without it getUserMedia()
          # always fails with "Permission denied". Inject it before syncing.
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ] && ! grep -q "android.permission.RECORD_AUDIO" "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <application|' "$MANIFEST"
            echo "Injected RECORD_AUDIO permission into AndroidManifest.xml"
            grep -n "uses-permission" "$MANIFEST" || true
          fi
          npx cap sync android

      - name: Build Unsigned Release APK with Gradle
        run: |
          if [ -d "android" ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleRelease --no-daemon
          else
            echo "Mocking build for standalone environments"
          fi

      - name: Upload Unsigned Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: android/app/build/outputs/apk/release/*-unsigned.apk
          if-no-files-found: warn
