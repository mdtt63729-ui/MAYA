          public class MJOverlayService extends Service {
              private WindowManager windowManager;
              private OrbView orbView;
              private EdgeGlowView edgeView;
              private static volatile MJOverlayService instance;
              private static volatile String state = "idle";
              private static volatile boolean appInForeground = true;

              public static void setAgentState(String s) {
                  state = s == null ? "idle" : s;
              }

              public static void setAppInForeground(boolean foreground) {
                  appInForeground = foreground;
                  MJOverlayService svc = instance;
                  if (svc != null) svc.updateEdgeVisibility();
              }

              public static boolean isRunning() {
                  return instance != null;
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }

              @Override
              public void onCreate() {
                  super.onCreate();
                  instance = this;
                  windowManager = (WindowManager) getSystemService(WINDOW_SERVICE);
                  float density = getResources().getDisplayMetrics().density;

                  // --- Edge lighting (full-screen, not touchable, auto-fits any phone) ---
                  edgeView = new EdgeGlowView(this);
                  WindowManager.LayoutParams edgeParams = new WindowManager.LayoutParams(
                          WindowManager.LayoutParams.MATCH_PARENT,
                          WindowManager.LayoutParams.MATCH_PARENT,
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                                  | WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                                  | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS
                                  | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                          PixelFormat.TRANSLUCENT);
                  edgeParams.gravity = Gravity.CENTER;
                  try {
                      windowManager.addView(edgeView, edgeParams);
                  } catch (Exception ignored) {
                  }

                  // --- Floating particle orb ---
                  orbView = new OrbView(this);
                  int size = (int) (density * 64);
                  WindowManager.LayoutParams params = new WindowManager.LayoutParams(
                          size, size,
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                                  | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                          PixelFormat.TRANSLUCENT);
                  params.gravity = Gravity.TOP | Gravity.START;
                  params.x = 24;
                  params.y = 420;
                  try {
                      windowManager.addView(orbView, params);
                  } catch (Exception e) {
                      stopSelf();
                      return;
                  }
                  updateEdgeVisibility();
              }

              private void updateEdgeVisibility() {
                  if (edgeView != null) {
                      edgeView.setVisibility(appInForeground ? View.GONE : View.VISIBLE);
                  }
              }

              @Override
              public void onDestroy() {
                  if (orbView != null) {
                      try { windowManager.removeView(orbView); } catch (Exception ignored) { }
                      orbView = null;
                  }
                  if (edgeView != null) {
                      try { windowManager.removeView(edgeView); } catch (Exception ignored) { }
                      edgeView = null;
                  }
                  instance = null;
                  super.onDestroy();
              }

              /** Voice-synced motion parameters for the current session state. */
              private static float[] stateMotion() {
                  // {amplitude, pulseSpeed, rotation, spread}
                  if ("speaking".equals(state)) return new float[]{0.42f, 3.2f, 2.6f, 0.20f};
                  if ("listening".equals(state)) return new float[]{0.22f, 2.2f, 1.6f, 0.10f};
                  if ("thinking".equals(state) || "searching".equals(state)) return new float[]{0.28f, 2.6f, 2.0f, 0.14f};
                  if ("connecting".equals(state)) return new float[]{0.30f, 3.0f, 2.2f, 0.16f};
                  return new float[]{0.10f, 1.0f, 0.7f, 0.03f};
              }

              /**
               * Particle orb — mirrors the in-app Jarvis orb: orbiting particle
               * ring with a glowing core. Rainbow hue auto-cycles; pulse and
               * ring spread follow the live voice state.
               */
              private class OrbView extends View {
                  private static final int PARTICLES = 46;
                  private final Paint glow = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint core = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint particle = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final float[] angles = new float[PARTICLES];
                  private final float[] speeds = new float[PARTICLES];
                  private final float[] radii = new float[PARTICLES];
                  private WindowManager.LayoutParams params;
                  private float phase = 0f;
                  private float downX, downY, startX, startY;
                  private long downAt;
                  private boolean dragging;

                  OrbView(Context c) {
                      super(c);
                      java.util.Random rnd = new java.util.Random();
                      for (int i = 0; i < PARTICLES; i++) {
                          angles[i] = rnd.nextFloat() * 360f;
                          speeds[i] = 0.5f + rnd.nextFloat() * 1.5f;
                          radii[i] = 0.45f + rnd.nextFloat() * 0.42f;
                      }
                      post(animator);
                  }

                  void setParams(WindowManager.LayoutParams p) {
                      params = p;
                  }

                  private final Runnable animator = new Runnable() {
                      @Override
                      public void run() {
                          phase += 0.05f;
                          invalidate();
                          postDelayed(this, 33); // ~30fps — battery conscious
                      }
                  };

                  @Override
                  protected void onDraw(Canvas canvas) {
                      float cx = getWidth() / 2f, cy = getHeight() / 2f;
                      float base = Math.min(cx, cy);
                      float[] m = stateMotion();
                      float pulse = (float) Math.sin(phase * m[1]);
                      int hue = (int) ((phase * 40f) % 360f);
                      float pScale = getResources().getDisplayMetrics().density / 2f;

                      // Ambient glow behind the orb
                      glow.setShader(new RadialGradient(cx, cy, base,
                              Color.HSVToColor(150, new float[]{(hue + 70f) % 360f, 0.9f, 1f}),
                              Color.TRANSPARENT, Shader.TileMode.CLAMP));
                      canvas.drawCircle(cx, cy, base * 0.95f, glow);

                      // Orbiting particle ring — the in-app orb look
                      for (int i = 0; i < PARTICLES; i++) {
                          float a = (float) Math.toRadians(angles[i] + phase * m[2] * speeds[i]);
                          float r = base * (radii[i] * (0.85f + 0.15f * pulse) + m[3] * pulse);
                          float px = cx + (float) Math.cos(a) * r;
                          float py = cy + (float) Math.sin(a) * r * 0.92f;
                          int ph = (hue + i * 9) % 360;
                          particle.setColor(Color.HSVToColor(235, new float[]{ph, 0.85f, 1f}));
                          float size = 2.2f * (0.8f + 0.7f * (0.5f + 0.5f * pulse)) * pScale;
                          canvas.drawCircle(px, py, size, particle);
                      }

                      // Glowing core
                      core.setShader(new RadialGradient(cx, cy, base * 0.42f,
                              Color.HSVToColor(255, new float[]{hue, 0.55f, 1f}),
                              Color.HSVToColor(140, new float[]{(hue + 40f) % 360f, 0.9f, 0.4f}),
                              Shader.TileMode.CLAMP));
                      float coreR = base * (0.30f + 0.12f * m[0] * pulse);
                      canvas.drawCircle(cx, cy, coreR, core);
                      core.setShader(null);
                      core.setColor(Color.argb(220, 255, 255, 255));
                      canvas.drawCircle(cx - coreR * 0.15f, cy - coreR * 0.18f, coreR * 0.18f, core);
                  }

                  @Override
                  public boolean onTouchEvent(MotionEvent e) {
                      switch (e.getAction()) {
                          case MotionEvent.ACTION_DOWN:
                              downX = e.getRawX();
                              downY = e.getRawY();
                              startX = params.x;
                              startY = params.y;
                              downAt = System.currentTimeMillis();
                              dragging = false;
                              return true;
                          case MotionEvent.ACTION_MOVE:
                              float dx = e.getRawX() - downX;
                              float dy = e.getRawY() - downY;
                              if (Math.abs(dx) > 8 || Math.abs(dy) > 8) dragging = true;
                              params.x = startX + (int) dx;
                              params.y = startY + (int) dy;
                              try {
                                  windowManager.updateViewLayout(this, params);
                              } catch (Exception ignored) {
                              }
                              return true;
                          case MotionEvent.ACTION_UP:
                              if (!dragging && System.currentTimeMillis() - downAt < 400) {
                                  Intent i = new Intent(getContext(), MainActivity.class);
                                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                                  try {
                                      getContext().startActivity(i);
                                  } catch (Exception ignored) {
                                  }
                              } else {
                                  // Edge magnetism — snap to the nearest side
                                  try {
                                      int w = getResources().getDisplayMetrics().widthPixels;
                                      params.x = (params.x + getWidth() / 2 < w / 2) ? 8 : w - getWidth() - 8;
                                      windowManager.updateViewLayout(this, params);
                                  } catch (Exception ignored) {
                                  }
                              }
                              return true;
                      }
                      return false;
                  }
              }

              /**
               * Rainbow edge lighting — frosted blurred glow around the screen
               * edges, visible ONLY while the MJ app is minimized. Thickness
               * scales with the shorter screen side so it auto-fits any phone.
               */
              private class EdgeGlowView extends View {
                  private final Paint edgePaint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private float phase = 0f;

                  EdgeGlowView(Context c) {
                      super(c);
                      // BlurMaskFilter requires software rendering
                      setLayerType(LAYER_TYPE_SOFTWARE, null);
                      post(animator);
                  }

                  private final Runnable animator = new Runnable() {
                      @Override
                      public void run() {
                          phase += 0.05f;
                          if (getVisibility() == VISIBLE) invalidate();
                          postDelayed(this, 33);
                      }
                  };

                  @Override
                  protected void onDraw(Canvas canvas) {
                      int w = getWidth(), h = getHeight();
                      if (w <= 0 || h <= 0) return;
                      float thickness = Math.min(w, h) * 0.035f;
                      float[] m = stateMotion();
                      float alpha = 0.35f + 0.65f * (0.5f + 0.5f * (float) Math.sin(phase * m[1]));
                      if ("idle".equals(state)) alpha *= 0.45f;
                      int hue = (int) ((phase * 40f) % 360f);
                      int[] colors = new int[7];
                      for (int i = 0; i < colors.length; i++) {
                          colors[i] = Color.HSVToColor((int) (alpha * 255),
                                  new float[]{(hue + i * 51f) % 360f, 0.85f, 1f});
                      }
                      edgePaint.setMaskFilter(new BlurMaskFilter(thickness * 0.9f, BlurMaskFilter.Blur.NORMAL));
                      // top & bottom edges
                      edgePaint.setShader(new LinearGradient(0, 0, w, 0, colors, null, Shader.TileMode.CLAMP));
                      canvas.drawRect(0, 0, w, thickness, edgePaint);
                      canvas.drawRect(0, h - thickness, w, h, edgePaint);
                      // left & right edges
                      edgePaint.setShader(new LinearGradient(0, 0, 0, h, colors, null, Shader.TileMode.CLAMP));
                      canvas.drawRect(0, 0, thickness, h, edgePaint);
                      canvas.drawRect(w - thickness, 0, w, h, edgePaint);
                  }
              }
          }
